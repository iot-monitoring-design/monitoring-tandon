<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard Master Tandon</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    min-height: 100vh;

    padding: 15px;

    color: #e2e8f0;

    background:
        radial-gradient(
            circle at top,
            #172554 0%,
            #0f172a 40%,
            #020617 100%
        );
}

.container {

    width: 100%;

    max-width: 1250px;

    margin: auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.title-area {

    display: flex;

    align-items: center;

    gap: 13px;
}

.logo {

    width: 52px;
    height: 52px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 15px;

    font-size: 27px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );

    box-shadow:
        0 10px 30px
        rgba(37,99,235,.30);
}

.title {

    font-size: 25px;

    font-weight: 900;

    color: #f8fafc;
}

.subtitle {

    margin-top: 3px;

    font-size: 12px;

    color: #94a3b8;
}

.broker-status {

    padding:
        9px 15px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 800;

    white-space: nowrap;
}

.connected {

    color: #4ade80;

    background:
        rgba(34,197,94,.14);
}

.disconnected {

    color: #f87171;

    background:
        rgba(239,68,68,.14);
}


/* =========================================================
   SUMMARY
========================================================= */

.summary {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 20px;
}

.summary-card {

    padding: 18px;

    border-radius: 18px;

    background:
        rgba(15,23,42,.85);

    border:
        1px solid
        rgba(148,163,184,.12);
}

.summary-label {

    font-size: 11px;

    color: #64748b;

    margin-bottom: 6px;
}

.summary-value {

    font-size: 25px;

    font-weight: 900;

    color: #f8fafc;
}


/* =========================================================
   TANK GRID
========================================================= */

.tank-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}


/* =========================================================
   TANK CARD
========================================================= */

.tank-card {

    padding: 22px;

    border-radius: 23px;

    background:
        rgba(15,23,42,.90);

    border:
        1px solid
        rgba(148,163,184,.12);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.25);
}

.tank-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;

    gap: 10px;
}

.tank-name {

    font-size: 19px;

    font-weight: 900;

    color: #f8fafc;
}

.location {

    margin-top: 4px;

    font-size: 11px;

    color: #64748b;
}

.sensor-type {

    margin-top: 5px;

    font-size: 10px;

    color: #38bdf8;
}

.device-status {

    padding:
        6px 10px;

    border-radius: 15px;

    font-size: 10px;

    font-weight: 800;

    white-space: nowrap;
}


/* =========================================================
   MAIN TANK
========================================================= */

.tank-main {

    display: grid;

    grid-template-columns:
        1fr 170px;

    align-items: center;

    gap: 15px;
}

.percent {

    font-size: 65px;

    line-height: 1;

    font-weight: 900;

    color: #38bdf8;
}

.level-label {

    margin-top: 6px;

    font-size: 12px;

    color: #94a3b8;
}

.level-status {

    display: inline-block;

    margin-top: 13px;

    padding:
        7px 13px;

    border-radius: 18px;

    font-size: 11px;

    font-weight: 800;
}


/* =========================================================
   TANK VISUAL
========================================================= */

.tank-wrapper {

    display: flex;

    justify-content: center;
}

.tank {

    width: 125px;

    height: 210px;

    position: relative;

    overflow: hidden;

    border:
        5px solid
        #475569;

    border-radius:
        17px 17px 25px 25px;

    background:
        linear-gradient(
            180deg,
            #1e293b,
            #0f172a
        );

    box-shadow:
        inset 0 0 25px
        rgba(0,0,0,.4);
}

.tank-top {

    position: absolute;

    top: -13px;

    left: 12%;

    width: 76%;

    height: 25px;

    border:
        5px solid
        #64748b;

    border-radius: 50%;

    background: #1e293b;

    z-index: 5;
}

.water {

    position: absolute;

    left: 0;

    bottom: 0;

    width: 100%;

    height: 0%;

    transition:
        height .8s ease,
        background .5s ease;

    background:
        linear-gradient(
            180deg,
            #38bdf8,
            #2563eb
        );
}

.water::before {

    content: "";

    position: absolute;

    top: -9px;

    left: -10%;

    width: 120%;

    height: 18px;

    border-radius: 50%;

    background:
        rgba(125,211,252,.85);
}


/* =========================================================
   DATA
========================================================= */

.data-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 9px;

    margin-top: 22px;
}

.data-box {

    padding: 12px;

    border-radius: 13px;

    background:
        rgba(30,41,59,.75);
}

.data-label {

    font-size: 10px;

    color: #64748b;
}

.data-value {

    margin-top: 5px;

    font-size: 14px;

    font-weight: 800;

    color: #f8fafc;

    word-break: break-word;
}


/* =========================================================
   HISTORY
========================================================= */

.history-card {

    margin-top: 20px;

    padding: 22px;

    border-radius: 23px;

    background:
        rgba(15,23,42,.90);

    border:
        1px solid
        rgba(148,163,184,.12);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.25);
}

.history-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}

.history-title {

    font-size: 19px;

    font-weight: 900;
}

.history-subtitle {

    margin-top: 4px;

    font-size: 11px;

    color: #64748b;
}

.chart-container {

    width: 100%;

    overflow-x: auto;

    background:
        #0b1220;

    border-radius: 15px;

    padding: 8px;
}

canvas {

    width: 100%;

    height: 330px;

    display: block;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    text-align: center;

    margin-top: 25px;

    color: #475569;

    font-size: 11px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px) {

    .summary {

        grid-template-columns:
            1fr 1fr 1fr;
    }

    .tank-grid {

        grid-template-columns:
            1fr;
    }
}


@media(max-width:550px) {

    body {

        padding: 10px;
    }

    .header {

        align-items:
            flex-start;
    }

    .title {

        font-size: 19px;
    }

    .subtitle {

        font-size: 10px;
    }

    .broker-status {

        font-size: 10px;

        padding:
            7px 9px;
    }

    .summary-card {

        padding: 12px 8px;

        text-align: center;
    }

    .summary-label {

        font-size: 9px;
    }

    .summary-value {

        font-size: 18px;
    }

    .tank-main {

        grid-template-columns:
            1fr;
    }

    .tank-wrapper {

        order: -1;
    }

    .percent {

        font-size: 52px;
    }

    .data-grid {

        grid-template-columns:
            1fr 1fr;
    }

    canvas {

        height: 280px;
    }
}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="title-area">

        <div class="logo">
            💧
        </div>

        <div>

            <div class="title">
                Dashboard Master Tandon
            </div>

            <div class="subtitle">
                Monitoring Multi ESP32 • MQTT HiveMQ
            </div>

        </div>

    </div>


    <div
        id="brokerStatus"
        class="broker-status disconnected">

        🔴 MQTT OFFLINE

    </div>

</div>



<!-- =====================================================
     SUMMARY
===================================================== -->

<div class="summary">

    <div class="summary-card">

        <div class="summary-label">
            TOTAL TANDON
        </div>

        <div
            id="totalTank"
            class="summary-value">

            0

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            PERANGKAT ONLINE
        </div>

        <div
            id="onlineTank"
            class="summary-value">

            0 / 0

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            UPDATE TERAKHIR
        </div>

        <div
            id="lastUpdate"
            class="summary-value">

            --

        </div>

    </div>

</div>



<!-- =====================================================
     TANK CONTAINER
     
     KARTU TANDON AKAN DIBUAT OTOMATIS DI SINI
===================================================== -->

<div
    id="tankGrid"
    class="tank-grid">
</div>



<!-- =====================================================
     HISTORY
===================================================== -->

<div class="history-card">

    <div class="history-header">

        <div>

            <div class="history-title">
                📈 Grafik Monitoring 24 Jam
            </div>

            <div class="history-subtitle">
                Data dicatat setiap 1 jam
            </div>

        </div>

    </div>


    <div class="chart-container">

        <canvas
            id="historyChart"
            width="1100"
            height="330">
        </canvas>

    </div>

</div>



<div class="footer">

    ESP32 Multi Tandon Monitoring
    • MQTT HiveMQ Cloud
    • GitHub Pages

</div>


</div>



<script>

/* =========================================================
   =========================================================

   KONFIGURASI TANDON

   =========================================================
   =========================================================

   ⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐

   BAGIAN INI YANG PALING PENTING OM.

   Kalau mau mengubah NAMA dan LOKASI,
   ubah bagian ini saja.

   =========================================================
*/


const TANK_CONFIG = [

    {
        id: 1,

        name:
            "Tandon Mesjid",

        location:
            "Mesjid",

        sensor:
            "A0120AM",

        dataTopic:
            "tandon/1/data",

        statusTopic:
            "tandon/1/status"
    },


    {
        id: 2,

        name:
            "Tandon Office",

        location:
            "Office",

        sensor:
            "A0120AM",

        dataTopic:
            "tandon/2/data",

        statusTopic:
            "tandon/2/status"
    },


    {
        id: 3,

        name:
            "Tandon JSN",

        location:
            "Lokasi Baru",

        sensor:
            "JSN-SR04T",

        dataTopic:
            "tandon/3/data",

        statusTopic:
            "tandon/3/status"
    }

];


/*
=========================================================
   CONTOH KALAU NANTI MAU TAMBAH TANDON 4

   Tinggal tambahkan:

   {
       id: 4,
       name: "Tandon 4",
       location: "Gudang",
       sensor: "JSN-SR04T",
       dataTopic: "tandon/4/data",
       statusTopic: "tandon/4/status"
   }

=========================================================
*/


/* =========================================================
   KONFIGURASI HIVEMQ
========================================================= */

const MQTT_HOST =
    "a1cd69b564c54fb2a27c2ad31940a4d2.s1.eu.hivemq.cloud";


const MQTT_PORT =
    8884;


/*
   Gunakan akun MQTT khusus dashboard.

   ⚠️ JANGAN menggunakan akun admin HiveMQ.
*/

const MQTT_USERNAME =
    "dashboard";


const MQTT_PASSWORD =
    "12345678";


/* =========================================================
   MQTT
========================================================= */

const clientID =
    "dashboard-master-" +
    Math.random()
        .toString(16)
        .substring(2);


const mqttURL =
    "wss://" +
    MQTT_HOST +
    ":" +
    MQTT_PORT +
    "/mqtt";


const mqttOptions = {

    username:
        MQTT_USERNAME,

    password:
        MQTT_PASSWORD,

    clientId:
        clientID,

    clean:
        true,

    connectTimeout:
        10000,

    reconnectPeriod:
        3000
};


let client = null;


/* =========================================================
   DATA TANDON
========================================================= */

const tanks = {};


TANK_CONFIG.forEach(
    function(config) {

        tanks[config.id] = {

            online:
                false,

            lastMessage:
                0,

            persen:
                0,

            cm:
                0,

            pulse:
                null,

            rssi:
                null,

            ip:
                "--",

            waktu:
                "--"
        };

    }
);


/* =========================================================
   BUAT KARTU TANDON OTOMATIS
========================================================= */

function buatTankCards() {

    const grid =
        document.getElementById(
            "tankGrid"
        );


    grid.innerHTML = "";


    TANK_CONFIG.forEach(
        function(config) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "tank-card";


            card.innerHTML = `

                <div class="tank-header">

                    <div>

                        <div class="tank-name">

                            💧
                            ${config.name}

                        </div>

                        <div class="location">

                            📍
                            ${config.location}

                        </div>

                        <div class="sensor-type">

                            Sensor:
                            ${config.sensor}

                        </div>

                    </div>


                    <div
                        id="status-${config.id}"
                        class="device-status disconnected">

                        🔴 OFFLINE

                    </div>

                </div>


                <div class="tank-main">

                    <div>

                        <div
                            id="percent-${config.id}"
                            class="percent">

                            --%

                        </div>


                        <div class="level-label">

                            LEVEL AIR

                        </div>


                        <div
                            id="level-${config.id}"
                            class="level-status">

                            Menunggu data...

                        </div>

                    </div>


                    <div class="tank-wrapper">

                        <div class="tank">

                            <div class="tank-top"></div>

                            <div
                                id="water-${config.id}"
                                class="water">

                            </div>

                        </div>

                    </div>

                </div>


                <div class="data-grid">


                    <div class="data-box">

                        <div class="data-label">
                            JARAK
                        </div>

                        <div
                            id="cm-${config.id}"
                            class="data-value">

                            -- cm

                        </div>

                    </div>


                    <div class="data-box">

                        <div class="data-label">
                            PULSE
                        </div>

                        <div
                            id="pulse-${config.id}"
                            class="data-value">

                            --

                        </div>

                    </div>


                    <div class="data-box">

                        <div class="data-label">
                            RSSI
                        </div>

                        <div
                            id="rssi-${config.id}"
                            class="data-value">

                            --

                        </div>

                    </div>


                    <div class="data-box">

                        <div class="data-label">
                            WAKTU
                        </div>

                        <div
                            id="time-${config.id}"
                            class="data-value">

                            --

                        </div>

                    </div>


                    <div class="data-box">

                        <div class="data-label">
                            IP ESP32
                        </div>

                        <div
                            id="ip-${config.id}"
                            class="data-value">

                            --

                        </div>

                    </div>


                    <div class="data-box">

                        <div class="data-label">
                            DATA
                        </div>

                        <div
                            id="data-${config.id}"
                            class="data-value">

                            Menunggu

                        </div>

                    </div>


                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );


    document.getElementById(
        "totalTank"
    ).innerText =
        TANK_CONFIG.length;


    document.getElementById(
        "onlineTank"
    ).innerText =
        "0 / " +
        TANK_CONFIG.length;

}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary() {

    let online =
        0;


    TANK_CONFIG.forEach(
        function(config) {

            if (
                tanks[
                    config.id
                ].online
            ) {

                online++;

            }

        }
    );


    document.getElementById(
        "onlineTank"
    ).innerText =
        online +
        " / " +
        TANK_CONFIG.length;

}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(
    id,
    online
) {

    if (
        !tanks[id]
    ) {

        return;

    }


    tanks[id].online =
        online;


    const element =
        document.getElementById(
            "status-" + id
        );


    if (
        !element
    ) {

        return;

    }


    if (
        online
    ) {

        element.innerText =
            "🟢 ONLINE";

        element.className =
            "device-status connected";

    }

    else {

        element.innerText =
            "🔴 OFFLINE";

        element.className =
            "device-status disconnected";

    }


    updateSummary();

}


/* =========================================================
   UPDATE TANK
========================================================= */

function updateTank(
    id,
    data
) {

    if (
        !tanks[id]
    ) {

        return;

    }


    const state =
        tanks[id];


    const percent =
        Number(
            data.persen
        );


    const cm =
        Number(
            data.cm
        );


    state.persen =
        Number.isFinite(percent)
            ? percent
            : 0;


    state.cm =
        Number.isFinite(cm)
            ? cm
            : 0;


    state.pulse =
        data.pulse ??
        null;


    state.rssi =
        data.rssi ??
        null;


    state.ip =
        data.ip ||
        "--";


    state.waktu =
        data.waktu ||
        "--";


    state.online =
        true;


    state.lastMessage =
        Date.now();


    /* =====================================================
       ELEMENT
    ===================================================== */

    const percentElement =
        document.getElementById(
            "percent-" + id
        );


    const waterElement =
        document.getElementById(
            "water-" + id
        );


    const cmElement =
        document.getElementById(
            "cm-" + id
        );


    const pulseElement =
        document.getElementById(
            "pulse-" + id
        );


    const rssiElement =
        document.getElementById(
            "rssi-" + id
        );


    const timeElement =
        document.getElementById(
            "time-" + id
        );


    const ipElement =
        document.getElementById(
            "ip-" + id
        );


    const dataElement =
        document.getElementById(
            "data-" + id
        );


    if (
        !percentElement
    ) {

        return;

    }


    /* =====================================================
       LEVEL
    ===================================================== */

    percentElement.innerText =
        state.persen +
        "%";


    waterElement.style.height =
        Math.max(
            0,
            Math.min(
                100,
                state.persen
            )
        ) +
        "%";


    /* =====================================================
       JARAK
    ===================================================== */

    cmElement.innerText =
        Number.isFinite(
            state.cm
        )
        ? state.cm.toFixed(1) +
          " cm"
        : "--";


    /* =====================================================
       PULSE
    ===================================================== */

    if (
        state.pulse !== null &&
        state.pulse !== undefined
    ) {

        pulseElement.innerText =
            state.pulse +
            " us";

    }

    else {

        pulseElement.innerText =
            "--";

    }


    /* =====================================================
       RSSI
    ===================================================== */

    if (
        state.rssi !== null &&
        state.rssi !== undefined
    ) {

        rssiElement.innerText =
            state.rssi +
            " dBm";

    }

    else {

        rssiElement.innerText =
            "--";

    }


    /* =====================================================
       WAKTU
    ===================================================== */

    timeElement.innerText =
        state.waktu;


    /* =====================================================
       IP
    ===================================================== */

    ipElement.innerText =
        state.ip;


    dataElement.innerText =
        "Realtime";


    /* =====================================================
       LEVEL STATUS
    ===================================================== */

    const levelElement =
        document.getElementById(
            "level-" + id
        );


    if (
        state.persen < 20
    ) {

        levelElement.innerText =
            "🔴 LEVEL RENDAH";

        levelElement.style.color =
            "#f87171";

        levelElement.style.background =
            "rgba(239,68,68,.15)";


        percentElement.style.color =
            "#fb7185";


        waterElement.style.background =
            "linear-gradient(180deg,#fb7185,#dc2626)";

    }

    else if (
        state.persen <= 50
    ) {

        levelElement.innerText =
            "🟡 LEVEL SEDANG";

        levelElement.style.color =
            "#facc15";

        levelElement.style.background =
            "rgba(234,179,8,.15)";


        percentElement.style.color =
            "#facc15";


        waterElement.style.background =
            "linear-gradient(180deg,#facc15,#ea580c)";

    }

    else {

        levelElement.innerText =
            "🟢 LEVEL BAIK";

        levelElement.style.color =
            "#4ade80";

        levelElement.style.background =
            "rgba(34,197,94,.15)";


        percentElement.style.color =
            "#38bdf8";


        waterElement.style.background =
            "linear-gradient(180deg,#38bdf8,#2563eb)";

    }


    updateStatus(
        id,
        true
    );


    document.getElementById(
        "lastUpdate"
    ).innerText =
        new Date()
            .toLocaleTimeString(
                "id-ID"
            );


    /* =====================================================
       SIMPAN HISTORY
    ===================================================== */

    simpanHistoryPerJam(
        id
    );

}


/* =========================================================
   MQTT CONNECT
========================================================= */

function connectMQTT() {

    console.log(
        "MQTT connecting:",
        mqttURL
    );


    client =
        mqtt.connect(
            mqttURL,
            mqttOptions
        );


    client.on(
        "connect",
        function() {

            console.log(
                "MQTT CONNECTED"
            );


            const status =
                document.getElementById(
                    "brokerStatus"
                );


            status.innerText =
                "🟢 MQTT CONNECTED";


            status.className =
                "broker-status connected";


            /*
             * Subscribe semua topic
             */

            TANK_CONFIG.forEach(
                function(config) {

                    client.subscribe(
                        config.dataTopic,
                        function(error) {

                            if (
                                error
                            ) {

                                console.error(
                                    "Subscribe error:",
                                    config.dataTopic,
                                    error
                                );

                            }

                        }
                    );


                    client.subscribe(
                        config.statusTopic,
                        function(error) {

                            if (
                                error
                            ) {

                                console.error(
                                    "Subscribe error:",
                                    config.statusTopic,
                                    error
                                );

                            }

                        }
                    );

                }
            );

        }
    );


    client.on(
        "message",
        function(
            topic,
            message
        ) {

            const payload =
                message.toString();


            console.log(
                topic,
                payload
            );


            prosesMQTT(
                topic,
                payload
            );

        }
    );


    client.on(
        "error",
        function(error) {

            console.error(
                "MQTT ERROR:",
                error
            );


            setBrokerOffline();

        }
    );


    client.on(
        "close",
        function() {

            console.log(
                "MQTT CLOSED"
            );


            setBrokerOffline();

        }
    );


    client.on(
        "reconnect",
        function() {

            console.log(
                "MQTT RECONNECTING..."
            );

        }
    );

}


/* =========================================================
   PROSES MQTT
========================================================= */

function prosesMQTT(
    topic,
    payload
) {

    TANK_CONFIG.forEach(
        function(config) {


            /* =============================================
               STATUS
            ============================================= */

            if (
                topic ===
                config.statusTopic
            ) {

                updateStatus(
                    config.id,
                    payload.toLowerCase() ===
                    "online"
                );

                return;

            }


            /* =============================================
               DATA
            ============================================= */

            if (
                topic ===
                config.dataTopic
            ) {

                try {

                    const data =
                        JSON.parse(
                            payload
                        );


                    updateTank(
                        config.id,
                        data
                    );

                }

                catch(error) {

                    console.error(
                        "JSON error:",
                        config.id,
                        error
                    );

                }

            }

        }
    );

}


/* =========================================================
   BROKER OFFLINE
========================================================= */

function setBrokerOffline() {

    const status =
        document.getElementById(
            "brokerStatus"
        );


    status.innerText =
        "🔴 MQTT OFFLINE";


    status.className =
        "broker-status disconnected";

}


/* =========================================================
   OFFLINE TIMEOUT
=========================================================

   Kalau tidak menerima DATA selama 30 detik,
   perangkat dianggap OFFLINE.

========================================================= */

setInterval(
    function() {

        const now =
            Date.now();


        TANK_CONFIG.forEach(
            function(config) {

                const tank =
                    tanks[
                        config.id
                    ];


                if (
                    tank.lastMessage > 0 &&
                    now -
                    tank.lastMessage >
                    30000
                ) {

                    updateStatus(
                        config.id,
                        false
                    );

                }

            }
        );

    },
    3000
);


/* =========================================================
   HISTORY 24 JAM
=========================================================

   History disimpan di browser menggunakan localStorage.

   Maksimal 24 data per tandon.

========================================================= */

function getHistoryKey(
    id
) {

    return (
        "tandon_history_24h_" +
        id
    );

}


function loadHistory(
    id
) {

    try {

        const raw =
            localStorage.getItem(
                getHistoryKey(id)
            );


        if (
            !raw
        ) {

            return [];

        }


        const data =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(data)
        ) {

            return [];

        }


        return data;

    }

    catch(error) {

        console.error(
            "History load error:",
            error
        );


        return [];

    }

}


function saveHistory(
    id,
    history
) {

    try {

        localStorage.setItem(
            getHistoryKey(id),
            JSON.stringify(
                history
            )
        );

    }

    catch(error) {

        console.error(
            "History save error:",
            error
        );

    }

}


/* =========================================================
   CATAT SETIAP 1 JAM
========================================================= */

function simpanHistoryPerJam(
    id
) {

    const tank =
        tanks[id];


    if (
        !tank ||
        !tank.online
    ) {

        return;

    }


    const now =
        new Date();


    /*
     * ID jam.
     *
     * Contoh:
     * 2026-10-07 14
     */

    const hourID =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    let history =
        loadHistory(id);


    /*
     * Jangan simpan dua kali
     * pada jam yang sama.
     */

    if (
        history.length > 0 &&
        history[
            history.length - 1
        ].hourID === hourID
    ) {

        return;

    }


    history.push({

        hourID:
            hourID,

        waktu:
            now.toLocaleString(
                "id-ID",
                {
                    day:
                        "2-digit",

                    month:
                        "2-digit",

                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            ),

        persen:
            tank.persen,

        cm:
            tank.cm

    });


    /*
     * Maksimal 24 data.
     */

    if (
        history.length > 24
    ) {

        history =
            history.slice(
                history.length - 24
            );

    }


    saveHistory(
        id,
        history
    );


    gambarGrafik();

}


/* =========================================================
   GRAFIK
========================================================= */

function gambarGrafik() {

    const canvas =
        document.getElementById(
            "historyChart"
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#0b1220";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Gabungkan semua histori tandon.
     */

    const datasets =
        [];


    TANK_CONFIG.forEach(
        function(config) {

            const history =
                loadHistory(
                    config.id
                );


            datasets.push({

                config:
                    config,

                history:
                    history

            });

        }
    );


    let maxLength =
        0;


    datasets.forEach(
        function(dataset) {

            if (
                dataset.history.length >
                maxLength
            ) {

                maxLength =
                    dataset.history.length;

            }

        }
    );


    if (
        maxLength === 0
    ) {

        ctx.fillStyle =
            "#64748b";


        ctx.font =
            "16px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "Belum ada data histori",
            canvas.width / 2,
            canvas.height / 2
        );


        return;

    }


    /* =====================================================
       AREA GRAFIK
    ===================================================== */

    const left =
        55;

    const right =
        25;

    const top =
        25;

    const bottom =
        50;


    const width =
        canvas.width -
        left -
        right;


    const height =
        canvas.height -
        top -
        bottom;


    /* =====================================================
       GRID 0 - 100%
    ===================================================== */

    ctx.lineWidth =
        1;


    ctx.strokeStyle =
        "rgba(148,163,184,.12)";


    ctx.fillStyle =
        "#64748b";


    ctx.font =
        "10px Arial";


    for (
        let i = 0;
        i <= 10;
        i++
    ) {

        const y =
            top +
            height -
            (
                i / 10
            ) *
            height;


        ctx.beginPath();


        ctx.moveTo(
            left,
            y
        );


        ctx.lineTo(
            canvas.width - right,
            y
        );


        ctx.stroke();


        ctx.textAlign =
            "right";


        ctx.fillText(
            (i * 10) + "%",
            left - 8,
            y + 4
        );

    }


    /* =====================================================
       WARNA MASING-MASING TANDON
    ===================================================== */

    const colors = [

        "#38bdf8",

        "#4ade80",

        "#facc15",

        "#fb7185",

        "#c084fc",

        "#fb923c"

    ];


    /* =====================================================
       GAMBAR SETIAP TANDON
    ===================================================== */

    datasets.forEach(
        function(dataset, tankIndex) {

            const data =
                dataset.history;


            if (
                data.length === 0
            ) {

                return;

            }


            const color =
                colors[
                    tankIndex %
                    colors.length
                ];


            /* =============================================
               GARIS
            ============================================= */

            ctx.beginPath();


            data.forEach(
                function(item, index) {

                    let x;


                    if (
                        data.length === 1
                    ) {

                        x =
                            left +
                            width / 2;

                    }

                    else {

                        x =
                            left +
                            (
                                index /
                                (
                                    data.length - 1
                                )
                            ) *
                            width;

                    }


                    const y =
                        top +
                        height -
                        (
                            item.persen /
                            100
                        ) *
                        height;


                    if (
                        index === 0
                    ) {

                        ctx.moveTo(
                            x,
                            y
                        );

                    }

                    else {

                        ctx.lineTo(
                            x,
                            y
                        );

                    }

                }
            );


            ctx.strokeStyle =
                color;


            ctx.lineWidth =
                3;


            ctx.shadowColor =
                color;


            ctx.shadowBlur =
                5;


            ctx.stroke();


            ctx.shadowBlur =
                0;


            /* =============================================
               TITIK DATA
            ============================================= */

            data.forEach(
                function(item, index) {

                    let x;


                    if (
                        data.length === 1
                    ) {

                        x =
                            left +
                            width / 2;

                    }

                    else {

                        x =
                            left +
                            (
                                index /
                                (
                                    data.length - 1
                                )
                            ) *
                            width;

                    }


                    const y =
                        top +
                        height -
                        (
                            item.persen /
                            100
                        ) *
                        height;


                    ctx.beginPath();


                    ctx.arc(
                        x,
                        y,
                        4,
                        0,
                        Math.PI * 2
                    );


                    ctx.fillStyle =
                        "#0f172a";


                    ctx.fill();


                    ctx.strokeStyle =
                        color;


                    ctx.lineWidth =
                        2;


                    ctx.stroke();

                }
            );

        }
    );


    /* =====================================================
       LABEL WAKTU
    ===================================================== */

    const referenceHistory =
        datasets.find(
            function(dataset) {

                return (
                    dataset.history.length >
                    0
                );

            }
        );


    if (
        referenceHistory
    ) {

        const data =
            referenceHistory.history;


        data.forEach(
            function(item, index) {

                let x;


                if (
                    data.length === 1
                ) {

                    x =
                        left +
                        width / 2;

                }

                else {

                    x =
                        left +
                        (
                            index /
                            (
                                data.length - 1
                            )
                        ) *
                        width;

                }


                ctx.fillStyle =
                    "#64748b";


                ctx.font =
                    "9px Arial";


                ctx.textAlign =
                    "center";


                const waktu =
                    item.waktu || "";


                /*
                 * Ambil jam dari teks waktu.
                 */

                const jam =
                    waktu.length >= 16
                    ? waktu.substring(
                        12,
                        17
                      )
                    : waktu;


                ctx.fillText(
                    jam,
                    x,
                    canvas.height - 18
                );

            }
        );

    }


    /* =====================================================
       LEGEND
    ===================================================== */

    let legendX =
        left;


    let legendY =
        12;


    datasets.forEach(
        function(dataset, index) {

            if (
                dataset.history.length === 0
            ) {

                return;

            }


            const color =
                colors[
                    index %
                    colors.length
                ];


            ctx.fillStyle =
                color;


            ctx.fillRect(
                legendX,
                legendY - 8,
                12,
                4
            );


            ctx.fillStyle =
                "#cbd5e1";


            ctx.font =
                "10px Arial";


            ctx.textAlign =
                "left";


            ctx.fillText(
                dataset.config.name,
                legendX + 17,
                legendY
            );


            legendX +=
                130;

        }
    );

}


/* =========================================================
   INIT
========================================================= */

buatTankCards();


gambarGrafik();


connectMQTT();


</script>
